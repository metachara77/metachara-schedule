<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>METACHARA | September Schedule</title>
  <meta name="description" content="メタチャラ 9月スケジュール">

  <meta property="og:type" content="website">
  <meta property="og:title" content="METACHARA | September Schedule">
  <meta property="og:description" content="メタチャラ 9月スケジュール">
  <meta property="og:url" content="https://metachara77.github.io/metachara-schedule/">
  <meta property="og:image" content="https://metachara77.github.io/metachara-schedule/september.jpg?v=202609">
  <meta property="og:image:secure_url" content="https://metachara77.github.io/metachara-schedule/september.jpg?v=202609">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="METACHARA September Schedule">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="METACHARA | September Schedule">
  <meta name="twitter:description" content="メタチャラ 9月スケジュール">
  <meta name="twitter:image" content="https://metachara77.github.io/metachara-schedule/september.jpg?v=202609">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .calendar-app {
      width: 100%;
      background: #fff;
    }

    .toolbar {
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #dadce0;
      background: #fff;
    }

    .month-title {
      font-size: 28px;
      font-weight: 500;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .nav button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #f1f3f4;
      color: #1a73e8;
      font-size: 23px;
      cursor: pointer;
    }

    .nav .today {
      font-size: 0;
    }

    .nav .today::after {
      content: "";
      display: block;
      width: 19px;
      height: 19px;
      margin: auto;
      border-radius: 50%;
      background: #1a73e8;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      height: 48px;
      border-bottom: 1px solid #dadce0;
    }

    .weekday {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: #5f6368;
    }

    .weekday:first-child {
      color: #1a73e8;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: #dadce0;
      border-bottom: 1px solid #dadce0;
    }

    .day {
      min-width: 0;
      min-height: 108px;
      padding: 5px 3px 6px;
      background: #fff;
      overflow: hidden;
    }

    .day.other-month {
      background: #fafafa;
    }

    .day-number {
      width: 29px;
      height: 29px;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 15px;
      color: #202124;
    }

    .other-month .day-number {
      color: #80868b;
    }

    .day-number.today {
      background: #1a73e8;
      color: #fff;
      font-weight: 600;
    }

    .events {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 1px;
      overflow: hidden;
    }

    .event {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin: 0;
      padding: 2px 1px;
      border-radius: 4px;
      box-sizing: border-box;

      font-size: 10px;
      font-weight: 500;
      line-height: 16px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;

      pointer-events: auto;
      cursor: pointer;
    }

    .error {
      padding: 24px 15px;
      text-align: center;
      color: #d93025;
      font-size: 14px;
    }

    #eventDetail {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 20px;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      z-index: 9999;
    }

    #eventDetailTitle {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    #eventDetailText {
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #eventDetailClose {
      margin-top: 15px;
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      background: #f1f3f4;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .page {
        width: 100vw;
        max-width: none;
      }

      .toolbar {
        height: 72px;
        padding: 0 14px;
      }

      .month-title {
        font-size: 26px;
      }

      .nav button {
        width: 40px;
        height: 40px;
      }

      .weekdays {
        height: 42px;
      }

      .weekday {
        font-size: 13px;
      }

      .day {
        min-height: 92px;
        padding: 4px 2px 5px;
        overflow: hidden;
      }

      .day-number {
        width: 27px;
        height: 27px;
        margin-bottom: 3px;
        font-size: 14px;
      }

      .events {
        width: 100%;
        padding: 0 1px;
        overflow: hidden;
      }

      .event {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 2px 1px !important;
        box-sizing: border-box;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        pointer-events: auto;
        cursor: pointer;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <img
    class="hero"
    src="september.jpg"
    alt="METACHARA September Schedule"
  >

  <section class="calendar-app">

    <div class="toolbar">
      <div class="month-title" id="monthTitle"></div>

      <div class="nav">
        <button id="prevMonth" aria-label="前の月">‹</button>
        <button id="todayButton" class="today" aria-label="今月"></button>
        <button id="nextMonth" aria-label="次の月">›</button>
      </div>
    </div>

    <div class="weekdays">
      <div class="weekday">日</div>
      <div class="weekday">月</div>
      <div class="weekday">火</div>
      <div class="weekday">水</div>
      <div class="weekday">木</div>
      <div class="weekday">金</div>
      <div class="weekday">土</div>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>
    <div id="errorBox" class="error" hidden></div>

  </section>
</div>

<div id="eventDetail">
  <div id="eventDetailTitle"></div>
  <div id="eventDetailText"></div>
  <button id="eventDetailClose">閉じる</button>
</div>

<script>
  const API_KEY = "AIzaSyDfHUMGLwd0-EO5kr96rbQ5OycwtNUi01M";

  const CALENDAR_ID = "metaiyo77@gmail.com";

  const HOLIDAY_CALENDAR_ID =
    "ja.japanese#holiday@group.v.calendar.google.com";

  let displayDate = new Date();
  displayDate.setDate(1);

  const monthTitle = document.getElementById("monthTitle");
  const calendarGrid = document.getElementById("calendarGrid");
  const errorBox = document.getElementById("errorBox");

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function localDateKey(date) {
    return (
      date.getFullYear() +
      "-" +
      pad(date.getMonth() + 1) +
      "-" +
      pad(date.getDate())
    );
  }

  function monthRange(date) {
    const first = new Date(
      date.getFullYear(),
      date.getMonth(),
      1
    );

    const start = new Date(first);
    start.setDate(first.getDate() - first.getDay());

    const end = new Date(start);
    end.setDate(start.getDate() + 42);

    return { start, end };
  }

  async function fetchEvents(calendarId, start, end) {
    const params = new URLSearchParams({
      key: API_KEY,
      timeMin: start.toISOString(),
      timeMax: end.toISOString(),
      singleEvents: "true",
      orderBy: "startTime",
      maxResults: "2500"
    });

    const url =
      "https://www.googleapis.com/calendar/v3/calendars/" +
      encodeURIComponent(calendarId) +
      "/events?" +
      params.toString();

    const res = await fetch(url);

    if (!res.ok) {
      throw new Error(await res.text());
    }

    const data = await res.json();
    return data.items || [];
  }

  function eventDateKey(event) {
    if (event.start && event.start.date) {
      return event.start.date;
    }

    if (event.start && event.start.dateTime) {
      return localDateKey(
        new Date(event.start.dateTime)
      );
    }

    return "";
  }

  function eventStyle(event) {

    if (event.__holiday) {
      return {
        background: "#34a853",
        color: "#ffffff"
      };
    }

    const eventColors = {
      "1":  "#a4bdfc",
      "2":  "#7ae7bf",
      "3":  "#dbadff",
      "4":  "#ff887c",
      "5":  "#fbd75b",
      "6":  "#ffb878",
      "7":  "#46d6db",
      "8":  "#e1e1e1",
      "9":  "#5484ed",
      "10": "#51b749",
      "11": "#dc2127"
    };

    if (event.colorId && eventColors[event.colorId]) {
      return {
        background: eventColors[event.colorId],
        color:
          event.colorId === "5" ||
          event.colorId === "8"
            ? "#202124"
            : "#ffffff"
      };
    }

    return {
      background: "#4285f4",
      color: "#ffffff"
    };
  }

  function makeEventElement(event) {
    const div = document.createElement("div");
    div.className = "event";

    div.textContent =
      event.summary || "予定";

    const style = eventStyle(event);

    div.style.background = style.background;
    div.style.color = style.color;
    div.style.cursor = "pointer";

    div.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();

      document.getElementById("eventDetailTitle").textContent =
        event.summary || "予定";

      document.getElementById("eventDetailText").textContent =
        event.description || "詳細はありません";

      document.getElementById("eventDetail").style.display =
        "block";
    }, true);

    div.title = event.summary || "";

    return div;
  }

  async function renderCalendar() {
    errorBox.hidden = true;
    calendarGrid.innerHTML = "";

    const month = displayDate.getMonth();

    monthTitle.textContent =
      (month + 1) + "月";

    const range =
      monthRange(displayDate);

    let events = [];

    try {
      const result = await Promise.all([
        fetchEvents(
          CALENDAR_ID,
          range.start,
          range.end
        ),
        fetchEvents(
          HOLIDAY_CALENDAR_ID,
          range.start,
          range.end
        )
      ]);

      const mainEvents = result[0];
      const holidays = result[1];

      holidays.forEach(function(event) {
        event.__holiday = true;
      });

      events =
        mainEvents.concat(holidays);

    } catch (e) {
      console.error(e);

      errorBox.hidden = false;
      errorBox.textContent =
        "スケジュールを読み込めませんでした。少し時間を置いて再読み込みしてください。";
    }

    const eventsByDate = {};

    events.forEach(function(event) {
      const key =
        eventDateKey(event);

      if (!key) return;

      if (!eventsByDate[key]) {
        eventsByDate[key] = [];
      }

      eventsByDate[key].push(event);
    });

    const today = new Date();
    const cursor =
      new Date(range.start);

    for (let i = 0; i < 42; i++) {

      const day =
        document.createElement("div");

      day.className = "day";

      if (
        cursor.getMonth() !== month
      ) {
        day.classList.add(
          "other-month"
        );
      }

      const number =
        document.createElement("div");

      number.className =
        "day-number";

      number.textContent =
        cursor.getDate();

      if (
        cursor.getFullYear() === today.getFullYear() &&
        cursor.getMonth() === today.getMonth() &&
        cursor.getDate() === today.getDate()
      ) {
        number.classList.add(
          "today"
        );
      }

      day.appendChild(number);

      const eventsWrap =
        document.createElement("div");

      eventsWrap.className =
        "events";

      const key =
        localDateKey(cursor);

      const dayEvents =
        eventsByDate[key] || [];

      dayEvents.forEach(function(event) {
        eventsWrap.appendChild(
          makeEventElement(event)
        );
      });

      day.appendChild(eventsWrap);
      calendarGrid.appendChild(day);

      cursor.setDate(
        cursor.getDate() + 1
      );
    }
  }

  document
    .getElementById("prevMonth")
    .addEventListener("click", function() {
      displayDate.setMonth(
        displayDate.getMonth() - 1
      );
      renderCalendar();
    });

  document
    .getElementById("nextMonth")
    .addEventListener("click", function() {
      displayDate.setMonth(
        displayDate.getMonth() + 1
      );
      renderCalendar();
    });

  document
    .getElementById("todayButton")
    .addEventListener("click", function() {
      displayDate =
        new Date();

      displayDate.setDate(1);

      renderCalendar();
    });

  document
    .getElementById("eventDetailClose")
    .addEventListener("click", function() {
      document.getElementById(
        "eventDetail"
      ).style.display = "none";
    });

  renderCalendar();
</script>

</body>
</html>
